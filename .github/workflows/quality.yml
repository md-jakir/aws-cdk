name: Code Quality & Security

on:
  push:
    branches:
      - master
      - develop
      - staging
  pull_request:
    branches:
      - master
      - develop
      - staging

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r hello-ecs/requirements.txt pylint flake8 black
      
      - name: Run Black (code formatter)
        run: black --check hello-ecs/hello_ecs/
        continue-on-error: true
      
      - name: Run Flake8
        run: flake8 hello-ecs/hello_ecs/
        continue-on-error: true
      
      - name: Run Pylint
        run: pylint hello-ecs/hello_ecs/
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install bandit safety
      
      - name: Bandit Security Scan
        run: bandit -r hello-ecs/hello_ecs/
        continue-on-error: true
      
      - name: Check for vulnerable dependencies
        run: safety check
        continue-on-error: true

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate config.json
        shell: bash
        run: |
          python3 -c "
          import json
          with open('hello-ecs/config.json') as f:
              config = json.load(f)
          required_envs = ['dev', 'stag', 'prod']
          for env in required_envs:
              if env not in config:
                  raise ValueError(f'Missing environment: {env}')
          print('✅ Config validation passed')
          "
